name: HIFINI Daily Sign

on:
  schedule:
    # 每天北京时间 8:00 运行（UTC 0:00）
    - cron: '0 0 * * *'
  workflow_dispatch:   # 支持手动触发

jobs:
  sign:
    runs-on: ubuntu-latest
    steps:
      # 将 @v4 升级到 @v5
      - name: Checkout code
        uses: actions/checkout@v5

      # 将 @v5 升级到 @v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # 如果没有 requirements.txt 可以跳过，但建议加上 requests
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run sign script
        env:
          HIFINI_COOKIE: ${{ secrets.HIFINI_COOKIE }}
        run: python hifini.py   # 改为你的脚本文件名
